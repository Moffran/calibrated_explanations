claim_id: CE-CAP-PRED-PROB-001
claim_type: capability
owner: calibrated_explanations
status: current

adr_links:
  - ADR-021

claim_text: >
  calibrated_explanations supports probabilistic regression queries through
  WrapCalibratedExplainer, returning empirical exceedance probabilities for a
  scalar threshold as calibrated probability values.

public_api:
  - calibrated_explanations.core.wrap_explainer.WrapCalibratedExplainer.predict_proba

task_types:
  - probabilistic_regression

requirements:
  - CE-REQ-PRED-PROB-API-001
  - CE-REQ-PRED-PROB-BOUNDS-001
  - CE-REQ-PRED-PROB-INSTANCE-001

verification:
  proves:
    - api_contract
    - probability_bounds
    - output_shape
    - instance_wise_determinism
  verification_type: automated

assumptions:
  - The explainer must be fitted and calibrated for a regression task before calling
    predict_proba with threshold=.
  - The threshold parameter must be a scalar float; the API raises ValidationError if
    threshold is omitted for a regression task.
  - The probability returned is empirical (conformal predictive system based on CPS).
    Coverage guarantees hold under exchangeability of calibration and test instances.
  - This claim does not assert frequency-calibration of P(Y > threshold | X); it
    asserts that the returned array is in [0, 1], has the correct shape, and is
    instance-wise for a frozen calibration state (CE-REQ-PRED-PROB-INSTANCE-001 requires
    identical outputs regardless of batch size, order or co-batched objects).
  - The API tests verify shape, bounds and batch invariance; they do not verify
    conformal coverage.

evidence_required:
  - commit_sha
  - package_version
  - test_id
  - dataset_id
  - random_seed
  - result
