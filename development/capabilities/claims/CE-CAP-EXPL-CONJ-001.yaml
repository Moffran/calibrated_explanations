claim_id: CE-CAP-EXPL-CONJ-001
claim_type: capability
owner: calibrated_explanations
status: current

adr_links:
  - ADR-008
  - ADR-042

claim_text: >
  calibrated_explanations supports conjunctive multi-feature explanation rules
  via add_conjunctions(), extending explanation objects produced through a
  WrapCalibratedExplainer workflow to include rules combining multiple features.

public_api:
  - calibrated_explanations.explanations.explanations.CalibratedExplanations.add_conjunctions
  - calibrated_explanations.explanations.explanations.AlternativeExplanations.add_conjunctions
  - calibrated_explanations.explanations.explanation.FactualExplanation.add_conjunctions
  - calibrated_explanations.explanations.explanation.AlternativeExplanation.add_conjunctions

task_types:
  - binary_classification
  - multiclass_classification
  - regression
  - probabilistic_regression

requirements:
  - CE-REQ-EXPL-CONJ-API-001
  - CE-REQ-EXPL-CONJ-RETURN-001
  - CE-REQ-EXPL-CONJ-RULE-001
  - CE-REQ-EXPL-CONJ-PARAM-001
  - CE-REQ-EXPL-CONJ-DOC-001

verification:
  proves:
    - api_contract
    - behavioral_contract
  does_not_prove:
    - conjunction rules produce strictly better explanations than single-feature rules
    - runtime performance under large n_top_features or max_rule_size values

assumptions:
  - The explainer must be fitted and calibrated before add_conjunctions is called.
  - Conjunctions are computed over the top n_top_features features by feature weight.
  - Runtime cost scales with n_top_features and max_rule_size.

evidence_required:
  - commit_sha
  - package_version
  - test_id
  - dataset_id
  - random_seed
  - result
