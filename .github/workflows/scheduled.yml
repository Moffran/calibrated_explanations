# Responsibility: weekly (and manually dispatched) heavy assurance that must
# not burn compute on the routine PR path: full supported-Python matrix,
# parity harnesses, core-vs-extras parity, performance regression checks,
# notebook execution, examples smoke, docs linkcheck, over-testing analysis,
# and the dependency/security audit. No job writes repository content.
name: Scheduled assurance
on:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scheduled-assurance
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  full-matrix-tests:
    name: Full-matrix tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ce-python
        with:
          python-version: ${{ matrix.python-version }}
          extras: 'dev'
      - name: Run non-viz tests
        run: pytest -q -m "not viz" -o addopts= --no-cov

  viz-tests:
    name: Viz tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ce-python
        with:
          python-version: '3.11'
          extras: 'dev,viz'
      - name: Run viz-marked tests
        run: pytest -q -m viz -o addopts= --no-cov

  parity-reference:
    name: Parity reference harness
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            tests/parity_reference/constraints.txt
            pyproject.toml
      - name: Install deps (parity determinism overlay)
        run: |
          python -m pip install --upgrade pip
          # tests/parity_reference/constraints.txt layers a scikit-learn<1.8
          # determinism pin on top of the project-wide constraints.txt floor,
          # scoped to this job only. See tests/parity_reference/README.md.
          pip install -r requirements.txt -c constraints.txt -c tests/parity_reference/constraints.txt
          pip install . -c constraints.txt -c tests/parity_reference/constraints.txt
      - name: Run parity harness (observed)
        run: |
          python tests/parity_reference/run_parity_reference.py --dataset classification
          python tests/parity_reference/run_parity_reference.py --dataset regression
          python tests/parity_reference/run_parity_reference.py --dataset multiclass
          python tests/parity_reference/run_parity_reference.py --dataset probabilistic_regression
      - name: Run parity harness (prediction)
        run: |
          python tests/parity_reference/run_parity_reference.py --dataset classification --condition-source prediction
          python tests/parity_reference/run_parity_reference.py --dataset regression --condition-source prediction
          python tests/parity_reference/run_parity_reference.py --dataset multiclass --condition-source prediction
          python tests/parity_reference/run_parity_reference.py --dataset probabilistic_regression --condition-source prediction

  parity-core-vs-extras:
    name: Core-vs-extras parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ce-python
        with:
          python-version: '3.11'
          extras: ''
      - name: Generate core parity snapshots
        run: |
          pip install jsonschema -c constraints.txt
          for dataset in classification regression multiclass probabilistic_regression; do
            python tests/parity_reference/run_parity_reference.py --dataset $dataset --condition-source observed --update
            python tests/parity_reference/run_parity_reference.py --dataset $dataset --condition-source prediction --update
          done
          mkdir -p artifacts/parity/core
          cp tests/parity_reference/*.json artifacts/parity/core/
      - name: Generate extras parity snapshots
        run: |
          pip install -e .[dev,viz] -c constraints.txt
          for dataset in classification regression multiclass probabilistic_regression; do
            python tests/parity_reference/run_parity_reference.py --dataset $dataset --condition-source observed --update
            python tests/parity_reference/run_parity_reference.py --dataset $dataset --condition-source prediction --update
          done
          mkdir -p artifacts/parity/extras
          cp tests/parity_reference/*.json artifacts/parity/extras/
      - name: Compare core vs extras parity snapshots
        run: |
          python scripts/quality/compare_parity_snapshots.py \
            --left artifacts/parity/core \
            --right artifacts/parity/extras
      - name: Upload parity snapshot artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6
        with:
          name: parity-core-vs-extras
          path: |
            artifacts/parity/core
            artifacts/parity/extras
          retention-days: 14

  perf-regression:
    name: Performance regression guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ce-python
        with:
          python-version: '3.11'
          extras: 'perf'
      - name: Install psutil for benchmarks
        run: pip install psutil -c constraints.txt
      - name: Run micro benchmark
        run: python scripts/perf/micro_bench_perf.py > tests/benchmarks/micro_current.json
      - name: Compare micro metrics against thresholds
        run: python scripts/perf/check_perf_micro.py tests/benchmarks/micro_current.json tests/benchmarks/perf_thresholds.json

  notebook-execution:
    name: Notebook execution report (advisory-with-artifact)
    # ADR-012: advisory on this dev mirror; blocking enforcement happens in
    # the release profile (`make local-checks-release` notebooks lane) and in
    # the authoritative upstream repository at release time.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ce-python
        with:
          python-version: '3.11'
          extras: 'notebooks,viz'
      - name: Run notebook execution driver (advisory mode)
        run: |
          mkdir -p reports/docs
          python scripts/docs/run_notebooks.py \
            --mode advisory \
            --cell-timeout 30 \
            --notebook-timeout 300 \
            --output reports/docs/notebook_execution_report.json
      - name: Upload notebook execution report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6
        with:
          name: notebook-exec-report
          path: reports/docs/notebook_execution_report.json
          retention-days: 14

  examples-smoke:
    name: Examples smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ce-python
        with:
          python-version: '3.11'
          extras: 'dev,viz'
      - name: Run examples smoke
        run: |
          set -o pipefail
          mkdir -p artifacts
          status=0
          for script in examples/use_cases/*.py; do
            echo "::group::$script"
            if ! python "$script" 2>&1 | tee -a artifacts/examples_smoke.log; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
      - name: Upload examples logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6
        with:
          name: examples-smoke-logs
          path: artifacts/examples_smoke.log
          retention-days: 14

  docs-linkcheck:
    name: Docs linkcheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            docs/requirements-doc.txt
            requirements.txt
            constraints.txt
            pyproject.toml
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements-doc.txt -c constraints.txt
          pip install -r requirements.txt -c constraints.txt
      - name: Run Sphinx linkcheck
        run: python -m sphinx -b linkcheck -D nbsphinx_execute=never docs docs/_build/linkcheck

  over-testing-analysis:
    name: Over-testing density analysis (advisory-with-artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ce-python
        with:
          python-version: '3.11'
          extras: 'dev'
      - name: Run tests with coverage contexts
        run: |
          pytest -q -o addopts= \
            --cov=src/calibrated_explanations \
            --cov-config=pyproject.toml \
            --cov-context=test \
            --no-cov-on-fail
      - name: Generate over-testing density report
        run: |
          python scripts/over_testing/over_testing_report.py \
            --require-multiple-contexts \
            --output-lines reports/over_testing/line_coverage_counts.csv \
            --output-blocks reports/over_testing/block_coverage_counts.csv \
            --output-summary reports/over_testing/summary.json \
            --output-metadata reports/over_testing/metadata.json
      - name: Detect redundant tests (fingerprint analysis)
        run: python scripts/over_testing/detect_redundant_tests.py
      - name: Upload over-testing reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v6
        with:
          name: over-testing-reports
          path: reports/over_testing/
          retention-days: 14

  dependency-audit:
    name: Dependency/security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit -c constraints.txt
      - name: Run dependency audit
        run: |
          pip-audit -r requirements.txt -r docs/requirements-doc.txt \
            --ignore-vuln GHSA-xm59-rqc7-hhvf
